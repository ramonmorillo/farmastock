name: Pruebas de FarmaStock Alert
on:
  push:
    branches: [main, feature/farmastock, feature/vigilancia-areas]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: python3 -m unittest discover -s tests/vigilancia -v
      - run: git diff --check
