name: Publicar FarmaStock Alert en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar el núcleo
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Preparar solo los archivos públicos
        run: |
          mkdir -p _site
          cp index.html tutorial.html *.mjs stock.css .nojekyll _site/
          cp -R assets docs _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
