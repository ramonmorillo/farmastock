name: Completar metadatos CIMA · sin correos
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cima-access-pilot-v2
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/vigilancia-areas'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar caché pública en un árbol separado
        run: |
          git fetch origin probe/cima-access-v2:refs/remotes/origin/probe/cima-access-v2
          git worktree add --detach "$RUNNER_TEMP/cima-public-data" refs/remotes/origin/probe/cima-access-v2
      - name: Completar pendientes por lotes y conservar cada avance
        run: |
          python3 scripts/vigilancia/batches.py --cache "$RUNNER_TEMP/cima-public-data/reports/cima-probe.json" --publish-dir "$RUNNER_TEMP/cima-public-data"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cima-access-public-data
          path: reports/
          retention-days: 7
